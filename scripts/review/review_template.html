<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gojri dictionary review</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #66645e; --line: #dcd9d0;
  --accent: #1f5f8b; --ok: #1f7a4d; --bad: #b3261e; --warn: #9a6a00; --okbg: #e3f3ea;
  --badbg: #fbe4e2; --warnbg: #fbf0d6; --mark: #ffe58a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a; --panel: #212326; --ink: #ecebe6; --muted: #a4a29a; --line: #3a3c40;
    --accent: #6cb4e4; --ok: #6fd09b; --bad: #ff8a80; --warn: #e8b84a; --okbg: #1b3a2a;
    --badbg: #44211f; --warnbg: #3d3114; --mark: #6a5a10;
  }
}
:root[data-theme="dark"] {
  --bg: #17181a; --panel: #212326; --ink: #ecebe6; --muted: #a4a29a; --line: #3a3c40;
  --accent: #6cb4e4; --ok: #6fd09b; --bad: #ff8a80; --warn: #e8b84a; --okbg: #1b3a2a;
  --badbg: #44211f; --warnbg: #3d3114; --mark: #6a5a10;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel);
  border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex;
  flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 17px; margin: 0 8px 0 0; }
.tabs { display: flex; gap: 4px; }
.tab { border: 1px solid var(--line); background: transparent; color: var(--ink);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.tab[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.spacer { flex: 1; }
button.small, label.small { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 14px; }
#saveNote { font-size: 13px; color: var(--muted); }
main { max-width: 1250px; margin: 0 auto; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.meta { color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; }
.bar > div { height: 100%; background: var(--accent); }
.crop-wrap { overflow-x: auto; padding: 8px; background: #fff; border: 1px solid var(--line);
  border-radius: 6px; margin: 10px 0; }
.crop-wrap img { display: block; max-width: none; image-rendering: auto; }
.glyphbox { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; margin: 8px 0; }
.says { text-align: left; font-size: 46px; line-height: 1.3; direction: rtl; font-family: "Noto Naskh Arabic", "Segoe UI", Tahoma, "Arabic Typesetting", serif; }
.says .cp { display: block; font-size: 13px; color: var(--muted); direction: ltr; font-family: ui-monospace, Consolas, monospace; }
.ar { direction: rtl; unicode-bidi: plaintext; text-align: right;
  font-family: "Noto Naskh Arabic", "Segoe UI", Tahoma, "Arabic Typesetting", serif; }
.ar.big { font-size: 30px; line-height: 1.8; }
.ar.vis { direction: ltr; unicode-bidi: isolate; text-align: left; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.ex { border-top: 1px solid var(--line); padding: 10px 0; }
.ex .ar { font-size: 24px; line-height: 1.7; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 6px; }
.btn { border: 2px solid var(--line); background: var(--panel); color: var(--ink); padding: 10px 18px;
  border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; min-width: 130px; }
.btn kbd { font-weight: 400; opacity: .7; margin-left: 4px; }
.btn.on.right, .btn.on.okb { border-color: var(--ok); background: var(--okbg); }
.btn.on.wrong { border-color: var(--bad); background: var(--badbg); }
.btn.on.unsure, .btn.on.crop { border-color: var(--warn); background: var(--warnbg); }
textarea, input[type=text], select { width: 100%; font: inherit; padding: 8px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
textarea.ar { font-size: 24px; line-height: 1.7; min-height: 80px; }
.note { background: var(--warnbg); border-left: 4px solid var(--warn); padding: 8px 12px;
  border-radius: 4px; margin: 8px 0; font-size: 14px; }
.nav { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
details.jump { margin: 0 0 12px; }
details.jump summary { cursor: pointer; color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { font: 12px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px;
  padding: 2px 5px; cursor: pointer; background: var(--panel); color: var(--ink); }
.chip.cur { outline: 2px solid var(--accent); }
.chip.s-right, .chip.s-ok { background: var(--okbg); }
.chip.s-wrong { background: var(--badbg); }
.chip.s-unsure, .chip.s-crop { background: var(--warnbg); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
td.ar, th.ar { text-align: right; }
.kpi { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0 16px; }
.kpi > div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; min-width: 130px; }
.kpi b { display: block; font-size: 24px; }
.hide { display: none; }
h2 { font-size: 18px; margin: 20px 0 6px; }
@media (max-width: 640px) { .btn { min-width: 0; flex: 1; } }
</style>
</head>
<body>
<header>
  <h1>Gojri dictionary review</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="table" id="tabTable"></button>
    <button class="tab" role="tab" data-tab="lines" id="tabLines"></button>
    <button class="tab" role="tab" data-tab="results">Results</button>
  </div>
  <div class="spacer"></div>
  <label class="small">Image size
    <input type="range" id="zoom" min="1" max="3" step="0.25" value="1" style="vertical-align:middle;width:90px">
  </label>
  <button class="small" id="btnExport">Export JSON</button>
  <label class="small">Import JSON<input type="file" id="fileImport" accept=".json" class="hide"></label>
  <span id="saveNote"></span>
</header>
<main id="view"></main>

<script>
const DATA = /*__DATA__*/null;
</script>
<script>
"use strict";
const KEY = "gojri-review-v1";
const T = DATA.table, L = DATA.lines;
let S = { tab: "table", pos: { table: 0, lines: 0 }, table: {}, lines: {}, zoom: 1, showAllEx: {} };
let canSave = true;

try {
  const raw = localStorage.getItem(KEY);
  if (raw) S = Object.assign(S, JSON.parse(raw));
} catch (e) { canSave = false; }

function save() {
  const note = document.getElementById("saveNote");
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    note.textContent = canSave ? "Saved in this browser" : "";
  } catch (e) {
    canSave = false;
    note.textContent = "Not saved in this browser. Use Export JSON.";
  }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);
const pct = x => (100 * x).toFixed(1) + "%";

function wilson(k, n, z = 1.96) {
  if (n === 0) return [0, 1];
  const p = k / n, d = 1 + z * z / n, c = p + z * z / (2 * n);
  const a = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n));
  return [Math.max(0, (c - a) / d), Math.min(1, (c + a) / d)];
}

/* ---------- image zoom: never smaller than native size ---------- */
function sizeImages() {
  document.querySelectorAll("img[data-z]").forEach(img => {
    const apply = () => { img.style.width = (img.naturalWidth * S.zoom * (+img.dataset.z)) + "px"; };
    if (img.complete && img.naturalWidth) apply(); else img.onload = apply;
  });
}

/* ---------- tabs ---------- */
function counts() {
  const t = Object.values(S.table).filter(v => v.mark).length;
  const l = Object.values(S.lines).filter(v => v.marks && v.marks.length).length;
  return { t, l };
}
function renderTabs() {
  const c = counts();
  $("tabTable").textContent = `Table check (${c.t}/${T.length})`;
  $("tabLines").textContent = `Line sample (${c.l}/${L.length})`;
  document.querySelectorAll(".tab").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.tab === S.tab ? "true" : "false"));
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; save(); render(); });
$("zoom").value = S.zoom;
$("zoom").oninput = e => { S.zoom = +e.target.value; save(); sizeImages(); };

/* ---------- jump chips ---------- */
function chips(items, kind) {
  const cur = S.pos[kind];
  return `<details class="jump"><summary>Jump to an item</summary><div class="chips">` +
    items.map((it, i) => {
      const st = kind === "table" ? (S.table[it.code] || {}).mark
        : statusOfLine(S.lines[it.page_line]);
      const label = kind === "table" ? it.code : it.n;
      return `<button class="chip ${st ? "s-" + st : ""} ${i === cur ? "cur" : ""}" data-go="${i}">${label}</button>`;
    }).join("") + `</div></details>`;
}
function bindJump(kind) {
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.pos[kind] = +b.dataset.go; save(); render(); });
}
function statusOfLine(v) {
  if (!v || !v.marks || !v.marks.length) return "";
  if (v.marks.includes("ok")) return "ok";
  if (v.marks.includes("crop")) return "crop";
  return "wrong";
}

/* ---------- table check ---------- */
function hlText(text, hl) {
  const [s, e] = hl;
  const mid = s === e ? `<mark>(nothing)</mark>` : `<mark>${esc(text.slice(s, e))}</mark>`;
  return esc(text.slice(0, s)) + mid + esc(text.slice(e));
}
function renderTable() {
  const i = S.pos.table, c = T[i], v = S.table[c.code] || {};
  const all = !!S.showAllEx[c.code];
  const shown = all ? c.examples : c.examples.slice(0, 3);
  const done = Object.values(S.table).filter(x => x.mark).length;
  $("view").innerHTML = `
  <div class="card">
    <div class="row"><b>Card ${i + 1} of ${T.length}</b>
      <span class="meta">Code ${c.code}. Used ${c.uses.toLocaleString()} times on ${c.pages} pages (${c.share}% of all glyphs). Cards run from most used to least used.</span></div>
    <div class="bar"><div style="width:${100 * done / T.length}%"></div></div>
    ${chips(T, "table")}
    <div class="glyphbox">
      ${c.glyph ? `<div><div class="meta">Shape in the PDF</div><div class="crop-wrap"><img data-z="1" src="${c.glyph}" alt="glyph ${c.code}"></div></div>`
        : `<div class="note">No example of this code found on pages 25 to 498.</div>`}
      <div><div class="meta">The table decodes it as</div>
        <div class="says">${c.out === "" ? "(nothing)" : c.out === " " ? "(a space)" : esc(c.out)}<span class="cp">${c.out_hex || "no output"}</span></div></div>
    </div>
    ${c.rule ? `<div class="note">${esc(c.rule)} Each example below shows what that example got. Mark the card wrong if any example is wrong, and say which.</div>` : ""}
    <div class="meta">The red box marks this code. The ink of a shape can stick out of its box, so look at the whole shape. The yellow part of the text is what the table made from this code.</div>
    ${shown.map(ex => `<div class="ex">
      <div class="meta">Page ${ex.page}</div>
      <div class="crop-wrap"><img data-z="1" src="${ex.img}" alt="example"></div>
      <div class="ar">${hlText(ex.ctx, ex.hl)}</div></div>`).join("")}
    ${c.examples.length > 3 ? `<button class="small" id="moreEx">${all ? "Show fewer examples" : `Show ${c.examples.length - 3} more examples`}</button>` : ""}
    <div class="btns">
      <button class="btn right ${v.mark === "right" ? "on" : ""}" data-m="right">Right <kbd>R</kbd></button>
      <button class="btn wrong ${v.mark === "wrong" ? "on" : ""}" data-m="wrong">Wrong <kbd>W</kbd></button>
      <button class="btn unsure ${v.mark === "unsure" ? "on" : ""}" data-m="unsure">Unsure <kbd>U</kbd></button>
    </div>
    <div class="${v.mark === "wrong" ? "" : "hide"}" id="fixBox">
      <label>What are the right letters? Type them here.
        <textarea class="ar" id="fix" dir="rtl">${esc(v.fix || "")}</textarea></label>
    </div>
    <label class="meta">Note (optional)<input type="text" id="note" value="${esc(v.note || "")}"></label>
    <div class="nav"><button class="small" id="prev">Back (left arrow)</button>
      <button class="small" id="next">Next (right arrow)</button></div>
  </div>`;
  bindJump("table");
  const set = (m) => {
    const cur = S.table[c.code] || {};
    S.table[c.code] = Object.assign(cur, { mark: cur.mark === m ? "" : m });
    save(); renderTabs();
    if (S.table[c.code].mark === "right" || S.table[c.code].mark === "unsure") move("table", 1); else render();
  };
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => set(b.dataset.m));
  const fix = $("fix"); if (fix) fix.oninput = () => { (S.table[c.code] ||= {}).fix = fix.value; save(); };
  $("note").oninput = e => { (S.table[c.code] ||= {}).note = e.target.value; save(); };
  const more = $("moreEx"); if (more) more.onclick = () => { S.showAllEx[c.code] = !all; save(); render(); };
  $("prev").onclick = () => move("table", -1); $("next").onclick = () => move("table", 1);
  sizeImages();
}

/* ---------- line sample ---------- */
function renderLines() {
  const i = S.pos.lines, r = L[i], v = S.lines[r.page_line] || {};
  const marks = v.marks || [];
  const wrong = marks.includes("letters") || marks.includes("spacing");
  const done = Object.values(S.lines).filter(x => x.marks && x.marks.length).length;
  $("view").innerHTML = `
  <div class="card">
    <div class="row"><b>Line ${i + 1} of ${L.length}</b>
      <span class="meta">Page ${r.page}, line ${r.line}. Compare the picture with the text under it.</span></div>
    <div class="bar"><div style="width:${100 * done / L.length}%"></div></div>
    ${chips(L, "lines")}
    <div class="crop-wrap"><img data-z="1.5" src="${r.img}" alt="line crop"></div>
    <div class="ar big vis" id="label">${esc(r.label)}</div>
    <div class="meta">The text is laid out left to right like the print, with each Arabic-script run reading right to left. Judge the Arabic-script text. If the English part is wrong too, fix it in the box.</div>
    ${r.raw ? `<details><summary class="meta">Show the raw decode of this line (before Pass 2)</summary><div class="ar big vis">${esc(r.raw)}</div></details>`
      : `<div class="meta">No raw decode shown for this line, because the raw and Pass 2 line counts differ on this page.</div>`}
    <div class="btns">
      <button class="btn okb ${marks.includes("ok") ? "on" : ""}" data-m="ok">OK <kbd>1</kbd></button>
      <button class="btn wrong ${marks.includes("letters") ? "on" : ""}" data-m="letters">Wrong letters <kbd>2</kbd></button>
      <button class="btn wrong ${marks.includes("spacing") ? "on" : ""}" data-m="spacing">Wrong spacing <kbd>3</kbd></button>
      <button class="btn crop ${marks.includes("crop") ? "on" : ""}" data-m="crop">Bad crop <kbd>4</kbd></button>
    </div>
    <div class="meta">Bad crop means the picture is cut, or shows a different line, but the text may be fine. Letters and spacing can both be marked.</div>
    <div class="${wrong ? "" : "hide"}" id="fixBox">
      <label>Fix the text. Change only the wrong part.
        <textarea class="ar vis" id="fix" dir="ltr">${esc(v.fix != null ? v.fix : r.label)}</textarea></label>
      ${r.raw ? `<label class="meta">Is the raw decode wrong in the same place?
        <select id="cause">
          <option value="">Not sure</option>
          <option value="raw_wrong" ${v.cause === "raw_wrong" ? "selected" : ""}>Yes, the raw decode has the same error</option>
          <option value="raw_right" ${v.cause === "raw_right" ? "selected" : ""}>No, the raw decode is right (Pass 2 broke it)</option>
        </select></label>` : ""}
    </div>
    <div class="nav"><button class="small" id="prev">Back (left arrow)</button>
      <button class="small" id="next">Next (right arrow)</button></div>
  </div>`;
  bindJump("lines");
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => setLineMark(r, b.dataset.m));
  const fix = $("fix"); if (fix) fix.oninput = () => { (S.lines[r.page_line] ||= {}).fix = fix.value; save(); };
  const cause = $("cause"); if (cause) cause.onchange = () => { (S.lines[r.page_line] ||= {}).cause = cause.value; save(); };
  $("prev").onclick = () => move("lines", -1); $("next").onclick = () => move("lines", 1);
  sizeImages();
}
function setLineMark(r, m) {
  const cur = S.lines[r.page_line] ||= {};
  let marks = new Set(cur.marks || []);
  if (marks.has(m)) marks.delete(m);
  else {
    if (m === "ok" || m === "crop") marks = new Set([m]);
    else { marks.delete("ok"); marks.delete("crop"); marks.add(m); }
  }
  cur.marks = [...marks];
  save(); renderTabs();
  if (cur.marks.includes("ok") || cur.marks.includes("crop")) move("lines", 1); else render();
}

/* ---------- results ---------- */
function renderResults() {
  const marked = Object.entries(S.lines).filter(([, v]) => v.marks && v.marks.length);
  const byKey = Object.fromEntries(L.map(r => [r.page_line, r]));
  let ok = 0, crop = 0, wrongN = 0, letters = 0, spacing = 0, rawWrong = 0, rawRight = 0, unk = 0;
  const wrongRows = [];
  for (const [k, v] of marked) {
    if (!byKey[k]) continue;
    if (v.marks.includes("ok")) ok++;
    else if (v.marks.includes("crop")) crop++;
    else {
      wrongN++;
      if (v.marks.includes("letters")) letters++;
      if (v.marks.includes("spacing")) spacing++;
      if (v.cause === "raw_wrong") rawWrong++; else if (v.cause === "raw_right") rawRight++; else unk++;
      wrongRows.push([byKey[k], v]);
    }
  }
  const n = ok + wrongN;
  const rate = (k) => {
    const [lo, hi] = wilson(k, n);
    return `${pct(n ? k / n : 0)} (95% CI ${pct(lo)} to ${pct(hi)})`;
  };
  const r3 = wrongN === 0 && n >= 30 ?`<div class="note">0 errors in ${n} lines. By the rule of three, the true error rate is probably below about ${pct(3 / n)}.</div>` : "";

  const tMarks = Object.entries(S.table);
  const tc = m => tMarks.filter(([, v]) => v.mark === m).length;
  const byCode = Object.fromEntries(T.map(c => [c.code, c]));
  const wrongCodes = tMarks.filter(([, v]) => v.mark === "wrong").map(([k, v]) => [byCode[k], v]).filter(x => x[0]);
  const unsureCodes = tMarks.filter(([, v]) => v.mark === "unsure").map(([k]) => byCode[k]).filter(Boolean);
  const wrongShare = wrongCodes.reduce((a, [c]) => a + c.share, 0);

  $("view").innerHTML = `
  <div class="card">
    <h2 style="margin-top:0">Line sample</h2>
    <div class="meta">${marked.length} of ${L.length} lines reviewed. Lines marked bad crop are left out of the rate, because the picture cannot be judged.</div>
    <div class="kpi">
      <div><b>${ok}</b>OK</div><div><b>${wrongN}</b>with an error</div><div><b>${crop}</b>bad crop</div>
    </div>
    <p><b>Error rate (any error): ${n ? rate(wrongN) : "no lines judged yet"}</b><br>
    Wrong letters: ${n ? rate(letters) : "-"}<br>Wrong spacing: ${n ? rate(spacing) : "-"}</p>
    ${r3}
    <div class="meta">Where the error came from, for lines that show the raw decode: raw decode wrong too ${rawWrong} (table or decode rule), raw decode right ${rawRight} (Pass 2 broke it), not sure or no raw ${unk}.</div>
    <div class="meta">The sample is spread evenly across the book. The interval treats it as a simple random sample, which is slightly cautious.</div>

    <h2>Table check</h2>
    <div class="kpi">
      <div><b>${tc("right")}</b>right</div><div><b>${tc("wrong")}</b>wrong</div>
      <div><b>${tc("unsure")}</b>unsure</div><div><b>${T.length - tc("right") - tc("wrong") - tc("unsure")}</b>not checked</div>
    </div>
    ${wrongCodes.length ? `<p>Wrong codes touch ${wrongShare.toFixed(2)}% of all glyphs in the book. One wrong code repeats on every page that uses it.</p>
    <table><tr><th>Code</th><th class="ar">Table says</th><th class="ar">Right letters</th><th>Uses</th><th>Pages</th></tr>
    ${wrongCodes.map(([c, v]) => `<tr><td>${c.code}</td><td class="ar">${esc(c.out)}</td><td class="ar">${esc(v.fix || "")}</td><td>${c.uses.toLocaleString()}</td><td>${c.pages}</td></tr>`).join("")}</table>` : `<p>No wrong codes marked.</p>`}
    ${unsureCodes.length ? `<p>Unsure: ${unsureCodes.map(c => c.code).join(", ")}</p>` : ""}

    ${wrongRows.length ? `<h2>Lines with errors</h2><table><tr><th>Line</th><th class="ar">Label</th><th class="ar">Your fix</th></tr>
    ${wrongRows.map(([r, v]) => `<tr><td>p${r.page} L${r.line}<br>${(v.marks || []).join("+")}</td><td class="ar vis">${esc(r.label)}</td><td class="ar vis">${v.fix && v.fix !== r.label ? esc(v.fix) : ""}</td></tr>`).join("")}</table>` : ""}
  </div>`;
}

/* ---------- navigation ---------- */
function move(kind, d) {
  const n = kind === "table" ? T.length : L.length;
  S.pos[kind] = Math.max(0, Math.min(n - 1, S.pos[kind] + d));
  save(); render();
  window.scrollTo(0, 0);
}
function render() {
  renderTabs();
  if (S.tab === "table") renderTable(); else if (S.tab === "lines") renderLines(); else renderResults();
}
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select" || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (S.tab === "table") {
    const c = T[S.pos.table];
    const press = m => document.querySelector(`[data-m="${m}"]`)?.click();
    if (k === "r") press("right"); else if (k === "w") press("wrong"); else if (k === "u") press("unsure");
    else if (k === "arrowright") move("table", 1); else if (k === "arrowleft") move("table", -1);
  } else if (S.tab === "lines") {
    const press = m => document.querySelector(`[data-m="${m}"]`)?.click();
    if (k === "1") press("ok"); else if (k === "2") press("letters"); else if (k === "3") press("spacing"); else if (k === "4") press("crop");
    else if (k === "arrowright") move("lines", 1); else if (k === "arrowleft") move("lines", -1);
  }
});

/* ---------- export / import ---------- */
$("btnExport").onclick = () => {
  const out = {
    tool: "gojri-dictionary-review", built: DATA.built, seed: DATA.seed,
    exported: new Date().toISOString(),
    table: T.filter(c => (S.table[c.code] || {}).mark).map(c => {
      const v = S.table[c.code];
      return { code: c.code, table_output: c.out, mark: v.mark, fix: v.fix || "", note: v.note || "", uses: c.uses, pages: c.pages };
    }),
    lines: L.filter(r => (S.lines[r.page_line] || {}).marks && S.lines[r.page_line].marks.length).map(r => {
      const v = S.lines[r.page_line];
      return { page_line: r.page_line, label: r.label, raw: r.raw, marks: v.marks,
        fix: v.fix && v.fix !== r.label ? v.fix : "", cause: v.cause || "" };
    }),
  };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  const t = new Date(), p = n => String(n).padStart(2, "0");
  a.download = `gojri_review_marks_${t.getFullYear()}${p(t.getMonth() + 1)}${p(t.getDate())}-${p(t.getHours())}${p(t.getMinutes())}.json`;
  a.href = URL.createObjectURL(blob); a.click(); URL.revokeObjectURL(a.href);
};
$("fileImport").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    (j.table || []).forEach(x => { S.table[x.code] = { mark: x.mark, fix: x.fix, note: x.note }; });
    (j.lines || []).forEach(x => { S.lines[x.page_line] = { marks: x.marks, fix: x.fix || undefined, cause: x.cause }; });
    save(); render();
  } catch (err) { alert("This file is not a valid export."); }
  e.target.value = "";
};

save(); render();
</script>
